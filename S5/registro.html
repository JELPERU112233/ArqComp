
<style>
*{box-sizing:border-box;margin:0;padding:0;}
#root{background:#060d1a;border-radius:10px;padding:12px;font-family:Arial,sans-serif;overflow:hidden;}
.sd{width:10px;height:10px;border-radius:50%;background:#1a2a3a;display:inline-block;transition:background .3s;}
.sd.on{background:#00e5ff;box-shadow:0 0 6px #00e5ff;}
.hi{transition:opacity .35s;}
.hi.dim{opacity:.12;}
@media(prefers-reduced-motion:no-preference){
  .dash-flow{stroke-dasharray:8 5;animation:df 1.4s linear infinite;}
  .dash-slow{stroke-dasharray:6 6;animation:df 2.2s linear infinite reverse;}
  .blink{animation:blk .9s ease-in-out infinite;}
  .scanline{animation:scan 5s linear infinite;}
}
@keyframes df{to{stroke-dashoffset:-52;}}
@keyframes blk{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes scan{0%{transform:translateY(-2px)}100%{transform:translateY(402px)}}
svg text{font-family:Arial,sans-serif;}
button{font-family:Arial,sans-serif;font-size:11px;background:transparent;border:1px solid #00e5ff44;color:#00e5ff;border-radius:4px;padding:3px 10px;cursor:pointer;transition:all .15s;}
button:hover{background:#00e5ff18;border-color:#00e5ff;}
select{background:#0a1525;border:1px solid #00e5ff44;color:#00e5ff;font-family:Arial,sans-serif;font-size:12px;border-radius:4px;padding:2px 4px;}
</style>

    <select id="oper"><option value="add">+</option><option value="sub">-</option><option value="and">AND</option><option value="or">OR</option></select>

    Selecciona operandos y operación, luego presiona <strong style="color:#00e5ff;">EJECUTAR</strong>. Se animará el ciclo completo Fetch → Decode → Execute → Writeback.

<script>
const STEPS=[
  {label:"1 · FETCH — UC lee la instrucción",         desc:"La UC usa el PC para ubicar la instrucción en memoria. Viaja al IR. El PC se incrementa para la siguiente instrucción.",              active:["box-uc","box-input"],  dim:["box-ula"],                pkt:{el:"pkt1",cx:8,cy:176,dx:100,dy:0,dur:800}},
  {label:"2 · DECODE — UC decodifica el opcode",      desc:"El IR contiene la instrucción en binario. La UC decodifica el opcode e identifica operandos. Genera señales de control para la ULA.",active:["box-uc"],              dim:["box-input","box-output"], pkt:null},
  {label:"3 · LOAD — Operandos a R1 y R2",            desc:"Los valores A y B se cargan en R1 y R2. Viajan por el bus interno de datos hacia las entradas de la ULA.",                          active:["box-regs","box-input"],dim:["box-output"],             pkt:{el:"pkt2",cx:197,cy:248,dx:205,dy:0,dur:800}},
  {label:"4 · EXECUTE — ULA calcula",                 desc:"La ULA recibe Op.A y Op.B desde los registros y la señal de operación desde la UC. Realiza el cálculo de forma combinacional.",     active:["box-ula","box-uc"],    dim:["box-input","box-output"], pkt:{el:"pkt3",cx:491,cy:172,dx:0,dy:62,dur:700}},
  {label:"5 · WRITEBACK — Resultado al ACC + Flags",  desc:"El resultado llega al ACC. Los flags se actualizan: Z=1 si resultado=0, C=1 si hubo acarreo, N=1 si negativo, V=1 si overflow.",  active:["box-regs","box-ula"],  dim:["box-input","box-output"], pkt:{el:"pkt3",cx:491,cy:246,dx:-215,dy:-2,dur:800}},
  {label:"6 · OUTPUT — Resultado sale de la UCP",     desc:"El resultado viaja por el bus externo hacia RAM, puerto de salida o registro destino. Ciclo completo terminado.",                   active:["box-output","box-ula"],dim:["box-input","box-uc"],    pkt:{el:"pkt4",cx:580,cy:265,dx:58,dy:-89,dur:900}}
];

let running=false,simA=0,simB=0,simOp='add';
function calc(a,b,op){return op==='add'?a+b:op==='sub'?a-b:op==='and'?a&b:a|b;}
function fobj(r){return{Z:r===0?1:0,C:r>255?1:0,N:r<0?1:0,V:(r>127||r<-128)?1:0};}
function fstr(r){const f=fobj(r);return`Z=${f.Z} C=${f.C} N=${f.N} V=${f.V}`;}
function setDots(i){for(let d=0;d<6;d++)document.getElementById('d'+d).classList.toggle('on',d<=i);}
function applyHl(dim){['box-ucp','box-uc','box-regs','box-ula','box-input','box-output'].forEach(id=>{const el=document.getElementById(id);if(!el)return;el.classList.toggle('dim',!!(dim&&dim.includes(id)));});}
function animPkt(cfg){if(!cfg)return Promise.resolve();return new Promise(res=>{const el=document.getElementById(cfg.el);if(!el){res();return;}el.setAttribute('cx',cfg.cx);el.setAttribute('cy',cfg.cy);el.setAttribute('opacity','1');const n=40,dx=cfg.dx/n,dy=cfg.dy/n;let s=0;const iv=setInterval(()=>{s++;el.setAttribute('cx',cfg.cx+dx*s);el.setAttribute('cy',cfg.cy+dy*s);if(s>=n){clearInterval(iv);el.setAttribute('opacity','0');res();}},cfg.dur/n);});}

async function startSim(){
  if(running)return;running=true;
  simA=parseInt(document.getElementById('opA').value);
  simB=parseInt(document.getElementById('opB').value);
  simOp=document.getElementById('oper').value;
  const sym={add:'+',sub:'-',and:'AND',or:'OR'}[simOp];
  const opLabel={add:'ADD',sub:'SUB',and:'AND',or:'OR'}[simOp];
  const res=calc(simA,simB,simOp);
  const fl=fobj(res);
  for(let i=0;i<STEPS.length;i++){
    const s=STEPS[i];
    setDots(i);
    document.getElementById('slabel').textContent=s.label;
    document.getElementById('sdesc').innerHTML=s.desc;
    applyHl(s.dim);
    if(i===2){document.getElementById('val-r1').textContent=simA;document.getElementById('val-r2').textContent=simB;document.getElementById('ula-a').textContent=simA;document.getElementById('ula-b').textContent=simB;document.getElementById('ula-op').textContent=opLabel+' \u2190 UC';document.getElementById('live-bar').textContent=`R1=${simA}  R2=${simB}  ACC=\u2014  Z=0  C=0  N=0  V=0`;}
    if(i===3){document.getElementById('val-ula-res').textContent=res;document.getElementById('ula-flags').textContent=fstr(res);}
    if(i===4){document.getElementById('val-acc').textContent=res;document.getElementById('fZ').textContent=fl.Z;document.getElementById('fC').textContent=fl.C;document.getElementById('fN').textContent=fl.N;document.getElementById('fV').textContent=fl.V;document.getElementById('live-bar').textContent=`R1=${simA}  R2=${simB}  ACC=${res}  Z=${fl.Z}  C=${fl.C}  N=${fl.N}  V=${fl.V}`;}
    await animPkt(s.pkt);
    await new Promise(r=>setTimeout(r,650));
  }
  document.getElementById('slabel').textContent=`CICLO COMPLETO: ${simA} ${sym} ${simB} = ${res}`;
  applyHl([]);running=false;
}

function resetSim(){
  running=false;setDots(-1);applyHl([]);
  document.getElementById('slabel').textContent='— Presiona EJECUTAR para iniciar el ciclo —';
  document.getElementById('sdesc').innerHTML='Selecciona operandos y operación, luego presiona <strong style="color:#00e5ff;">EJECUTAR</strong>. Se animará el ciclo completo Fetch → Decode → Execute → Writeback.';
  ['val-r1','val-r2','val-acc','val-ula-res'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent='\u2014';});
  ['fZ','fC','fN','fV'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent='0';});
  document.getElementById('ula-a').textContent='\u2014';document.getElementById('ula-b').textContent='\u2014';
  document.getElementById('ula-op').textContent='señal de operación \u2190 UC';
  document.getElementById('ula-flags').textContent='Z=0  C=0  N=0  V=0';
  document.getElementById('live-bar').textContent='R1=\u2014  R2=\u2014  ACC=\u2014  Z=0  C=0  N=0  V=0';
  ['pkt1','pkt2','pkt3','pkt4'].forEach(id=>{const e=document.getElementById(id);if(e)e.setAttribute('opacity','0');});
}

function hl(id){
  if(running)return;
  const m={uc:['box-input','box-output','box-ula'],regs:['box-input','box-output','box-ula'],ula:['box-input','box-output','box-uc'],input:['box-ula','box-uc'],output:['box-ula','box-uc','box-input']};
  if(m[id])applyHl(m[id]);
}
</script>
